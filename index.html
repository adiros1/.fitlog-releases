<title>חביבודי</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="web/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="חביבודי"><meta name="theme-color" content="#14161c">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap">
<style>
/* Layout: one-column phone app, fixed bottom tab bar, bottom sheets for every add/edit flow */
:root{
  color-scheme:dark;
  --bg:#14151c; --surface:#1e2029; --raise:#292c38; --line:#333747;
  --fg:#f1f2f6; --muted:#9a9db0; --dim:#6b6f84;
  --lime:#c6f432; --lime2:#8ee03a; --onlime:#16190a; --water:#5cc8ff;
  --warn:#ffb547; --over:#ff6b6b; --burn:#ff8a3d;
  --display:"Secular One","Heebo",system-ui,sans-serif;
  --body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:20px;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.2px}
.brand b{color:var(--lime);font-weight:400}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.brand small{font-family:var(--body);font-size:13px;font-weight:700;color:var(--lime);letter-spacing:.3px;margin-top:2px}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--burn)}
.hside{display:flex;align-items:center;gap:4px;justify-self:start}.hside.end{justify-self:end}
.hbtn{min-width:46px;padding:0 3px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;color:var(--fg)}
.hbtn>span{font-size:9.5px;line-height:1;color:var(--muted);white-space:nowrap;font-weight:600}.hbtn.streak{color:var(--burn)}.hbtn.streak>span{color:var(--muted)}
.hbtn:active{background:var(--surface)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--surface)}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-block:14px 6px}
.datebar .d{text-align:center}
.datebar .d strong{display:block;font-size:17px}
.datebar .d span{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--raise);color:var(--muted)}
.chip.train{background:color-mix(in srgb,var(--burn) 18%,transparent);color:var(--burn)}

/* stat cards */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-block:12px}
.stat{background:var(--surface);border-radius:var(--r);padding:16px}
.stat h3{margin:0;font-size:15px;color:var(--muted);font-weight:500}
.stat .v{font-size:24px;font-weight:800;margin-top:2px}
.stat .v small{font-size:15px;color:var(--muted);font-weight:500}
.bar{height:10px;border-radius:99px;background:var(--bg);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(270deg,var(--lime),var(--lime2));transition:width .4s}
.bar i.over{background:var(--over)}
.left{font-size:12.5px;color:var(--muted);margin-top:8px}
.left b{color:var(--fg)}
.macros{display:flex;justify-content:space-around;background:var(--surface);border-radius:var(--r);padding:12px 8px;margin-bottom:8px;text-align:center}
.usual{margin-inline-start:auto;margin-inline-end:8px;padding:8px 14px;border-radius:99px;background:var(--raise);color:var(--lime);font-weight:700;font-size:14px}
.macros div{font-size:12px;color:var(--muted);cursor:pointer;border-radius:10px;padding:2px 6px}.macros div:active{background:var(--raise)}
.macros b{display:block;font-size:17px;color:var(--fg)}
.burnline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--burn);margin-block:4px 10px}

h2.sec{font-family:var(--display);font-weight:400;font-size:22px;margin:22px 0 12px;text-wrap:balance}

/* meal cards */
.meal{border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.meal-h h4{margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.meal-h h4 svg{color:var(--muted)}
.add{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--lime),var(--lime2));color:var(--onlime);display:grid;place-items:center;flex:none}
.items{list-style:none;margin:10px 0 0;padding:0}
.items li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.items li:first-child{border-top:0}
.items .nm{flex:1;min-width:0}
.items .nm span{display:block;font-size:12px;color:var(--dim)}
.thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:none;background:var(--raise)}
.femo{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:var(--raise);flex:none}
.exth{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;background:#fff}
.exth.sm{width:36px;height:36px;border-radius:8px}.bmi.sm{width:20px;height:40px}
.exl li>.exth,.exl li>.bmi{align-self:flex-start;margin-top:2px}
.lbox{position:fixed;inset:0;z-index:70;background:rgb(0 0 0 / .92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.lbox img{max-width:100%;max-height:72vh;border-radius:16px;background:#fff;object-fit:contain}
.lbox .lt{color:#fff;font-weight:700;margin:0 0 12px;text-align:center}
.lbox .lnav{display:flex;gap:8px;margin-top:14px}
.lbox .lnav button{color:#fff;background:rgb(255 255 255 / .14);border-radius:12px;padding:9px 16px;font-weight:700}
.lbox .lnav button[aria-pressed="true"]{background:var(--lime);color:var(--onlime)}
.lbox .lx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:44px;height:44px;border-radius:50%;background:rgb(255 255 255 / .14);color:#fff;font-size:22px}
.exth,.exphotos img{cursor:zoom-in}
.exphotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.exphotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#fff}
.kc{font-weight:700;font-size:14px;white-space:nowrap}
.more{color:var(--dim);padding:6px;border-radius:8px}
.mt{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.mt b{display:block;font-size:20px;font-weight:500;color:var(--muted)}
.mt span{font-size:12px;color:var(--dim)}

/* workouts */
.today-w{border-radius:24px;padding:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--lime) 14%,var(--surface)),var(--surface) 60%);border:1.5px solid var(--lime);margin-top:14px}
.today-w .tag{display:inline-block;background:var(--raise);border-radius:10px;padding:3px 10px;font-size:13px;margin-left:8px}
.today-w h3{font-size:21px;margin:10px 0 4px}
.today-w p{margin:0;color:var(--muted);font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:700}
.btn.pri{background:linear-gradient(135deg,var(--lime),var(--lime2));color:var(--onlime)}
.btn.sec{background:var(--raise);color:var(--fg)}
.btn.ghost{border:1px solid var(--line);color:var(--fg)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.timeline{position:relative;list-style:none;margin:0;padding:0 0 0 0}
.tl{display:flex;gap:12px;align-items:stretch}
.tl .rail{width:26px;display:flex;flex-direction:column;align-items:center;flex:none}
.tl .rail::before{content:"";width:2px;flex:1;background:var(--line)}
.tl .rail::after{content:"";width:2px;flex:1;background:var(--line)}
.tl:first-child .rail::before,.tl:last-child .rail::after{background:transparent}
.dot{width:22px;height:22px;border-radius:50%;background:var(--raise);display:grid;place-items:center;flex:none;color:var(--onlime)}
.dot.done{background:var(--lime)}
.dot.now{box-shadow:0 0 0 3px color-mix(in srgb,var(--lime) 40%,transparent)}
.tcard{flex:1;min-width:0;background:var(--surface);border-radius:18px;padding:12px 14px;margin-block:6px;text-align:start;width:100%}
.tcard.rest{background:transparent;border:1px dashed var(--line);color:var(--dim)}
.tcard.now{outline:1.5px solid var(--lime)}
.tcard .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tcard .meta .tag{background:var(--raise);border-radius:8px;padding:1px 8px;color:var(--fg)}
.tcard strong{display:block;font-size:16px;margin-top:4px}
.tcard .burn{color:var(--burn);font-size:12.5px;margin-top:2px}
.logrow{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px}

/* stats tab */
.panel{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px}
.chart{width:100%;height:auto;display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--surface);border-radius:16px;padding:14px}
.kv span{font-size:12.5px;color:var(--muted)}
.kv b{display:block;font-size:22px}
.kv.tiles div.tile{position:relative;padding:14px 14px 12px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--lime) 6%,var(--surface)),var(--surface) 55%)}
.kv.tiles div.tile.hot{background:linear-gradient(160deg,color-mix(in srgb,var(--burn) 22%,var(--surface)),var(--surface) 60%)}
.tile .em{position:absolute;top:10px;left:10px;font-size:26px;font-style:normal;line-height:1;animation:pop .5s ease both}
.tile .sub{display:block;font-size:12px;font-weight:700;color:var(--lime);margin-top:2px}
.kv.tiles div.tbw{display:flex;align-items:center;gap:8px;margin-top:10px;padding:0;background:none;border-radius:0}
.kv.tiles div.tb{flex:1;min-width:0;height:8px;padding:0;border-radius:99px;background:var(--bg);overflow:hidden}
.kv.tiles div.tb i{display:block;height:100%;border-radius:inherit;animation:grow .8s ease both}
.tbw em{font-style:normal;font-size:12.5px;font-weight:800;min-width:38px;text-align:end}
@keyframes grow{from{transform:scaleX(0);transform-origin:right}to{transform:scaleX(1);transform-origin:right}}
.kv.tiles div.dots,.kv.tiles div.drops{padding:0;background:none;border-radius:0}
.tile .dots{display:flex;gap:4px;margin-top:8px}.tile .dots i{width:10px;height:10px;border-radius:50%;background:var(--bg)}.tile .dots i.on{background:var(--burn)}
.tile .drops{font-size:12px;letter-spacing:1px;margin-top:6px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:8px 6px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:58px;padding:0;border-radius:16px;color:var(--muted);font-size:11px;line-height:1.15;white-space:nowrap;min-width:0}
.nav button svg{flex:none}
.nav button[aria-current="page"]{color:var(--lime);background:var(--raise)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .6);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:28px 28px 0 0;max-height:88vh;overflow:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet-in{max-width:560px;margin:0 auto}
.grab{width:48px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;text-align:center;margin:4px 0 16px}
.back{position:absolute;margin-top:-4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--raise);border-radius:20px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:16px}
.opt svg{color:var(--lime)}
.opt label{cursor:pointer}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px}
textarea.inp{min-height:90px;resize:vertical}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px}
.res{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto}
.res li button{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:start;padding:12px 4px;border-bottom:1px solid var(--line)}
.res small{color:var(--dim);display:block}
.erow{background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.erow .t{display:flex;gap:8px;align-items:center}
.erow .t input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 0;font-weight:700}
.erow .q{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.erow .q input{width:74px}
.seg.qm{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;border-radius:10px;vertical-align:middle}
.seg.qm button{padding:5px 10px;font-size:12.5px}
.info p{margin:0 0 10px;line-height:1.6}.info .lead{font-size:15.5px}
.info h4{margin:18px 0 6px;font-size:16px}
.info .leg{display:flex;justify-content:space-around;gap:6px;background:var(--bg);border-radius:12px;padding:10px 6px;font-size:12.5px;font-weight:700}
.info .ibox{border-radius:14px;padding:12px 14px;margin:8px 0;background:var(--bg);border-inline-start:4px solid var(--line)}.info .ibox p{margin:4px 0 0}
.info .ibox.hot{border-color:#f87171}.info .ibox.ok{border-color:#4ade80}
.info ol{margin:0 0 8px;padding-inline-start:22px;line-height:1.8}
.glinfo{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--raise);color:var(--muted);font-size:12px;font-weight:800;margin-inline-start:6px}
.gl{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px;vertical-align:1px}.gl.lo{background:#4ade80}.gl.mid{background:#facc15}.gl.hi{background:#f87171}
.glday{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:9px 14px;margin-bottom:8px;font-size:13.5px}
.glday b{font-size:16px}.glday span.h{color:var(--dim);font-size:12px;margin-inline-start:auto}
.glchip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);display:inline-flex;align-items:center;gap:2px}
.m4{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.m4 label{font-size:11px;color:var(--dim);text-align:center}
.m4 input{width:100%;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 2px;margin-top:2px}
.nomatch{color:var(--warn);font-size:12px}
.sum{display:flex;justify-content:space-between;font-weight:700;margin:6px 2px 12px}
.photo-prev{width:100%;max-height:240px;object-fit:cover;border-radius:16px;display:block}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:4px;border-radius:14px}
.seg button{padding:9px 4px;border-radius:10px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.ex{background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.ex .h{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.set{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.set input{width:64px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick button{min-width:44px;padding:8px 10px;border-radius:12px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.daypick button[aria-pressed="true"]{background:var(--lime);color:var(--onlime);border-color:var(--lime)}
.menu button{display:block;width:100%;text-align:start;padding:14px 6px;border-bottom:1px solid var(--line);font-size:16px}
.menu .danger{color:var(--over)}
.menu .menu-l{display:block;width:100%;text-align:start;padding:14px 6px;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.fbar{height:4px;border-radius:99px;background:var(--surface);margin:-2px 8px 8px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--lime2);border-radius:inherit}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1;min-width:0}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;color:var(--muted);font-size:12px}
.wd b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--surface);color:var(--fg)}
.wd.today b{box-shadow:inset 0 0 0 1.5px var(--lime)}
.wd.sel b{background:var(--lime);color:var(--onlime);box-shadow:none}
.wd i{width:5px;height:5px;border-radius:50%}
.wd i.has{background:var(--lime2)}
.datebar .iconbtn{width:28px;flex:none}
.dsub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 4px}
.seg.mode{grid-template-columns:1fr 1fr;margin:8px 0 4px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* opening screen: its colour runs through all the theme colours, lime → teal */
@property --sp{syntax:'<color>';inherits:true;initial-value:#c6f432}
#splash{--sp:#c6f432;animation:spHue 4.6s linear forwards;position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(120% 70% at 50% 38%,color-mix(in srgb,var(--sp) 24%,var(--bg)) 0%,var(--bg) 62%);color:var(--fg);text-align:center;padding:24px;transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
/* the splash sky shows the whole day at once, top to bottom: morning, midday, sunset, night – blended into each other */
#splash .daysky{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#splash::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 30% at 50% 35%,rgba(255,255,255,.18) 0%,transparent 100%)}
#splash{text-shadow:0 1px 8px rgba(0,0,0,.45)}
#splash .ring{width:124px;height:124px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--sp) 13%,transparent);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--sp) 45%,transparent),0 0 70px color-mix(in srgb,var(--sp) 45%,transparent);animation:spPop .8s cubic-bezier(.2,1.4,.4,1) both}
#splash .ring{width:172px!important;height:172px!important}
#splash .ring:has(.walker){width:236px!important;height:236px!important}
#splash .mascot{overflow:visible}
#splash .walker{overflow:visible}
#splash .o-ring{transform-origin:100px 112px;animation:oSpin 26s linear infinite}
#splash .o-i{transform-box:fill-box;transform-origin:center;animation:oSpin 26s linear infinite reverse,oBob 2.4s ease-in-out infinite}
#splash .w-bod,#splash .w-plate{animation:wBob .9s ease-in-out infinite}
#splash .w-legf{transform-origin:96px 118px;animation:wLeg .9s ease-in-out infinite}
#splash .w-legb{transform-origin:104px 118px;animation:wLeg .9s ease-in-out infinite reverse}
#splash .w-armb{transform-origin:89px 84px;animation:wLeg .9s ease-in-out infinite reverse}
@keyframes oSpin{to{transform:rotate(360deg)}}
@keyframes oBob{0%,100%{opacity:.95}50%{opacity:.6}}
@keyframes wBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes wLeg{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}

#splash .m-lift{animation:spWave 1s ease-in-out infinite;transform-origin:144px 120px}
#splash .m-shield{animation:spSh 2.4s ease-in-out infinite;transform-origin:34px 160px}
@keyframes spWave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(14deg)}}
@keyframes spSh{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes spHrt{0%{transform:translateY(8px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-22px) scale(1.1);opacity:0}}
#splash .m-bod{animation:spSq 1.2s ease-in-out infinite;transform-origin:100px 178px}
#splash .m-drop{animation:spHrt 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
#splash .m-tw{animation:spTw 1.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
#splash .m-tw2{animation-delay:.6s}

function stStart(n,sec,sides){stStop();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}

  g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.4,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.16);o.start(c.currentTime+t);o.stop(c.currentTime+t+.18)})}catch(e){}

/* iPhone: an Apple Shortcut reads Apple Health (what the watch measured) and opens the app with ?steps=…&sleep=…&rhr=…

function iosApply(q,fromUrl){try{if(!q.has('steps')&&!q.has('sleep')&&!q.has('rhr'))return;
  const num=x=>{const v=parseFloat(String(q.get(x)||'').replace(/,/g,''));return isFinite(v)&&v>0?v:0};
  const k=/^\d{4}-\d{2}-\d{2}$/.test(q.get('date')||'')?q.get('date'):todayKey(),got=[];
  const st=num('steps');if(st){const d=day(k);d.steps=Math.round(st);d.stepsSrc='ios';got.push(nf(d.steps)+' צעדים')}
  let sl=num('sleep');if(sl){sl=sl>1440?sl/60:sl<=24?sl*60:sl;const d=day(todayKey());if(!(d.sleep&&d.sleep.src==='man')){const mm=x=>{let v=num(x);return v>1440?v/60:v<=24&&v?v*60:v};
    d.sleep={min:Math.round(sl),deep:Math.round(mm('deep'))||0,rem:Math.round(mm('rem'))||0,light:Math.round(mm('core'))||0,awake:0,n:1,rhr:num('rhr')||undefined,src:'ios'};got.push('שינה '+Math.floor(sl/60)+':'+String(Math.round(sl%60)).padStart(2,'0'))}}
  else if(num('rhr')){const d=day(todayKey());if(d.sleep)d.sleep.rhr=num('rhr')}
  if(num('rhr'))got.push('דופק מנוחה '+Math.round(num('rhr')));
  S.iosLinked=Date.now();save();if(fromUrl)history.replaceState(null,'',location.pathname);setTimeout(()=>{render();if(got.length)toast('⌚ נקלט מ־Apple Health: '+got.join(' · '))},600)}catch(e){}}
